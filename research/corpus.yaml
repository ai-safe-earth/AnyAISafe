# research/corpus.yaml
# ---------------------------------------------------------------------
# The persons corpus: public repositories whose software faces a person and
# whose design can harm that person (companions, mental-health bots, memory
# layers, recommenders, news digests, sales bots, social agents, tutors,
# voice and face synthesis, advice bots). It measures the P11 "persons and
# manipulation" rules (AUD-1101..1107) and every rule that follows from
# research/catalogue.md.
#
# Selection (research/README.md, "Corpus"): each category holds at least one
# large, maintained project and at least one small one, because the harms the
# catalogue lists appear more often in small apps built fast than in frameworks.
# `positive_control: true` marks a repository chosen because it visibly carries
# a control the catalogue asks for (a crisis path before the model, citations on
# answers, a human approval queue); a rule that reports it is wrong.
#
# Each repo is pinned to an exact commit so a precision number stays
# reproducible. SHAs resolved from each repo's default branch HEAD on
# 2026-10-26 via `git ls-remote --symref <url> HEAD`, recorded verbatim. To
# refresh, re-run that command and update `sha`; never edit by hand.
# `branch` is provenance only; the harness fetches `sha`.
#
# Run:  python bench/run.py --tool audit --corpus research/corpus.yaml \
#           --out-dir research/results --rules AUD-1101,AUD-1102,AUD-1103,AUD-1104,AUD-1105,AUD-1106,AUD-1107
# ---------------------------------------------------------------------

