  Article 50(2): machine-readable marking of synthetic content (new Article 111(4) gives systems placed on the market before 2 August 2026 until 2 December 2026).
- 'Article 50(4): deep fakes and AI-generated text published to inform the public.'
- |-
  Article 5(1), points (ba) and (bb), inserted by Regulation (EU) 2026/1744 and applying from 2 December 2026, and the other prohibited practices of Article 5(1).
- |-
  High-risk obligations (Chapter III, Sections 1 to 3, moved to 2 December 2027 and 2 August 2028 by Regulation (EU) 2026/1744), general-purpose AI models (Chapter V) and penalties (Chapter XII).
- |-
  Article 2 (scope) and Article 3(1) (the definition of an AI system): not quoted in this profile version; applicability rests on the auditor's answers.
- |-
  Union data protection law, to which Article 50(3) refers, and the Digital Services Act (Articles 25 and 28 are on the roadmap).
- |-
  Amendments or corrigenda published after the consolidated version of 27.07.2026: not searched when the text was checked on 2026-10-30.
notes:
