  guidance:
  - cite: Transparency guidelines (draft), point (101)
    source: gl-transparency
    excerpt: gl-101
    url: https://ec.europa.eu/newsroom/dae/redirection/document/131215
    quote: |-
      (101) Article 3(39) AI Act defines an ‘emotion recognition system’ as ‘an AI system for the purpose of identifying or inferring emotions or intentions of natural persons on the basis of their biometric data’. The detailed explanation of this notion provided in the Commission guidelines on the classification of high-risk AI systems, including the practical examples set out therein, are equally relevant in the context of Article 50(3) AI Act.
  - cite: Transparency guidelines (draft), point (105)
    source: gl-transparency
    excerpt: gl-105
    url: https://ec.europa.eu/newsroom/dae/redirection/document/131215
    quote: |-
      (105) The scope of the information to be provided: Deployers are required to inform natural persons concerned that they are exposed to an emotion recognition system or to a biometric categorisation system, which is being operated. The AI Act does not require including information about the reasons for the system’s operation, or if the system also processes information for purposes other than emotion recognition or biometric categorisation, which are required to be disclosed under Union data protection law (see Section 5.3.).
  - cite: Transparency guidelines (draft), point (110)
    source: gl-transparency
    excerpt: gl-110
    url: https://ec.europa.eu/newsroom/dae/redirection/document/131215
    quote: |-
      (110) The information obligation under Article 50(3) AI Act does not, in itself render the use of an emotion recognition and biometric categorisation system lawful. Nor does it legitimise intrusive or discriminatory uses that might be unlawful and prohibited under Article 5 AI Act or other Union law. Deployers need to comply with the information obligation in Article 50(3) AI Act, in addition to any applicable information requirements under Union data protection law. In certain cases, deployers can consider adding notifications pursuant to Article 50(3) AI Act to the information provided to data subjects under Union data protection law.
not_covered:
