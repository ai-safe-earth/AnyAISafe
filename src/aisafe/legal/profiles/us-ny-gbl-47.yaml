notes:
- |-
  Enforcement, quoted: § 1703. Enforcement. 1. Whenever the attorney general shall believe from evidence satisfactory to them that an operator has engaged in or is about to engage in any of the acts or practices stated to be unlawful in this article or in violation of section seventeen hundred one or seventeen hundred two of this article, they may bring an action in the name and on behalf of the people of the state of New York to enjoin an operator from continuing such unlawful acts or practices, and may seek civil penalties of up to fifteen thousand dollars per day for a violation under section seventeen hundred one or seventeen hundred two of this article, and may seek such other remedies as the court may deem appropriate.
