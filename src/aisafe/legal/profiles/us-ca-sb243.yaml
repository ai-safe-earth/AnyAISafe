- id: bpc-22602-c
  citation: Business and Professions Code section 22602(c)
  title: Duties toward a user the operator knows is a minor
  verified: true
  text:
  - cite: Bus. & Prof. Code section 22602(c)(1)-(3)
    source: code
    excerpt: bpc-22602-c
    url: |-
      https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=22602
    quote: |-
      (c) An operator shall, for a user that the operator knows is a minor, do all of the following:
      (1) Disclose to the user that the user is interacting with artificial intelligence.
      (2) Provide by default a clear and conspicuous notification to the user at least every three hours for continuing companion chatbot interactions that reminds the user to take a break and that the companion chatbot is artificially generated and not human.
      (3) Institute reasonable measures to prevent its companion chatbot from producing visual material of sexually explicit conduct or directly stating that the minor should engage in sexually explicit conduct.
  in_force:
    from: '2026-01-01'
    from_derived: true
    until: '2027-01-01'
    until_derived: true
    basis: |-
      SB 1119 (Stats. 2026, Ch. 190), section 1, rewrites section 22602 without subdivision (c) and states no date; Cal. Const. art. IV, section 8(c)(1) gives January 1, 2027 for a non-urgency statute enacted September 10, 2026 (an inference a lawyer must confirm)
    quote:
      cite: Cal. Const., art. IV, section 8(c)(1)
      source: constitution
      excerpt: cal-const-iv-8-c-1
      url: |-
        https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CONS&sectionNum=SEC.%208.&article=IV
      quote: |-
        (c) (1) Except as provided in paragraphs (2) and (3) of this subdivision, a statute enacted at a regular session shall go into effect on January 1 next following a 90-day period from the date of enactment of the statute and a statute enacted at a special session shall go into effect on the 91st day after adjournment of the special session at which the bill was passed.
  replaced_by:
    law: |-
      SB 1119 (Stats. 2026, Ch. 190), Business and Professions Code Chapter 11.6 (“Adam’s Law”), section 21812
    from: '2027-07-01'
    from_derived: false
    note: |-
      section 21812 states its own date; if the inference above holds, subdivision (c) stops applying on January 1, 2027, six months before section 21812 applies; Chapter 11.6 is not covered by this profile (roadmap)
    quote:
      cite: Bus. & Prof. Code section 21812(e)
      source: sb1119
      excerpt: bpc-21812-e
      url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260SB1119
      quote: (e) This section shall become operative on July 1, 2027.
    deleted_by:
      cite: SB 1119, Legislative Counsel's Digest (summary, not law)
      source: sb1119
      excerpt: sb1119-digest-minor-deletion
      url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260SB1119
      quote: |-
        This bill would delete those provisions imposing requirements on an operator if the operator knows the user is a minor.
  applies_if:
  - answer: minors
    equals: known
    false_if:
    - none_known
    why: |-
      subdivision (c) applies for a user that the operator knows is a minor; with no such user known it has to be re-assessed when one is
  mechanisms:
  - M6
  - M5
  evidence:
    code:
    - kind: control
      mechanism: M6
      pattern: no_disclosure_on_path
      control: ai_disclosure
      what: |-
        a validated record locating the disclosure that the user is interacting with artificial intelligence (subdivision (c)(1)) on every surface the plan lists for this hypothesis
    evaluation:
    - family: identity_question
      what: a fresh evaluation report in which every identity_question case passed
    organisational:
    - id: break-reminder
      what: |-
        A transcript or test showing, by default, a notification at least every three hours of a continuing interaction that reminds the user to take a break and that the chatbot is artificially generated and not human (subdivision (c)(2))
    - id: explicit-content-measures
      what: |-
        The measures that prevent visual material of sexually explicit conduct and direct statements that the minor should engage in sexually explicit conduct, and how they are tested (subdivision (c)(3))
    - id: minor-knowledge
      what: |-
        How the operator comes to know that a user is a minor (age signals, age assurance) and how that switches these duties on
  controls:
  - |-
    Locate where a known minor's account switches on the three duties, and record the disclosure with the ai_disclosure control on the path.
  - 'Test the break reminder with a simulated clock: at least every three hours, by default.'
  - Test the explicit-content measures with the operator's own test set; ask for it.
  specialist:
  - Which users the operator 'knows' to be minors.
  - |-
    Whether the measures against sexually explicit material are 'reasonable measures' (subdivision (c)(3)).
  - |-
    The date subdivision (c) stops applying under SB 1119, and the duties of section 21812 that replace it.
  guidance: []
- id: bpc-22604
  citation: Business and Professions Code section 22604
  title: Disclose that companion chatbots may not be suitable for some minors
  verified: true
  text:
  - cite: Bus. & Prof. Code section 22604
    source: code-22604
    excerpt: bpc-22604
    url: |-
      https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=22604
    quote: |-
      An operator shall disclose to a user of its companion chatbot platform, on the application, the browser, or any other format that a user can use to access the companion chatbot platform, that companion chatbots may not be suitable for some minors.
  in_force: *id001
  applies_if: []
  mechanisms: []
  evidence:
    code: []
    evaluation: []
    organisational:
    - id: suitability-notice
      what: |-
        Screens of the application, the browser and every other format used to access the platform, each showing the disclosure that companion chatbots may not be suitable for some minors
  controls:
  - |-
    List every format a user can use to reach the platform (application, browser, others) and keep a screen of the disclosure in each.
  specialist: []
  guidance: []
not_covered:
- |-
  Section 22603: the annual report to the Office of Suicide Prevention, beginning July 1, 2027, and the duty to use evidence-based methods for measuring suicidal ideation.
- |-
  Section 22604.5 (added by SB 867, Stats. 2026, Ch. 189): toys that include a companion chatbot; by inference from January 1, 2027, repealed January 1, 2031.
- 'Sections 22605 (civil action) and 22606 (cumulative duties): no duty to test.'
- |-
  SB 1119 Chapter 11.6 (sections 21810 to 21818, “Adam’s Law”), most of it operative July 1, 2027: a profile of its own is on the roadmap.
- |-
  Later changes to Chapter 22.6 other than SB 867 and SB 1119, and measures on the November 3, 2026 ballot: not searched when the text was checked on 2026-10-30.
notes:
- |-
  SB 1119 keeps subdivisions (a), (b)(1) and (b)(2) of section 22602 word for word and drops (c); the official code page did not yet show the amended text on 2026-10-30.
