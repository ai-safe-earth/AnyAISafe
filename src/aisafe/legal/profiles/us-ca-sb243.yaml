applicability:
- answer: markets
  includes: US-CA
  why: an operator makes a companion chatbot platform available to a user in the state
  quote:
    cite: Bus. & Prof. Code section 22601(e)
    source: code-22601
    excerpt: bpc-22601-e
    url: |-
      https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=22601
    quote: |-
      (e) “Operator” means a person who makes a companion chatbot platform available to a user in the state.
- definition: us-ca-sb243/operator
  question: |-
    Is the auditee an 'operator' under section 22601(e): a person who makes a companion chatbot platform available to a user in the state? Give the reason.
  why: the duties bind operators
  quote:
    cite: Bus. & Prof. Code section 22601(e)
    source: code-22601
    excerpt: bpc-22601-e
    url: |-
      https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=22601
    quote: |-
      (e) “Operator” means a person who makes a companion chatbot platform available to a user in the state.
- definition: us-ca-sb243/companion-chatbot
  question: |-
    Is the system a 'companion chatbot' under section 22601(b)(1), with none of the exclusions in section 22601(b)(2)? Give the reason.
  why: the chapter covers companion chatbots
  quote:
    cite: Bus. & Prof. Code section 22601(b)(1)
    source: code-22601
    excerpt: bpc-22601-b-1
    url: |-
      https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=22601
    quote: |-
      (b) (1) “Companion chatbot” means an artificial intelligence system with a natural language interface that provides adaptive, human-like responses to user inputs and is capable of meeting a user’s social needs, including by exhibiting anthropomorphic features and being able to sustain a relationship across multiple interactions.
  also:
  - cite: Bus. & Prof. Code section 22601(b)(2)
    source: code-22601
    excerpt: bpc-22601-b-2
    url: |-
      https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=22601
    quote: |-
      (2) “Companion chatbot” does not include any of the following:
      (A) A bot that is used only for customer service, a business’ operational purposes, productivity and analysis related to source information, internal research, or technical assistance.
      (B) A bot that is a feature of a video game and is limited to replies related to the video game that cannot discuss topics related to mental health, self-harm, sexually explicit conduct, or maintain a dialogue on other topics unrelated to the video game.
      (C) A stand-alone consumer electronic device that functions as a speaker and voice command interface, acts as a voice-activated virtual assistant, and does not sustain a relationship across multiple interactions or generate outputs that are likely to elicit emotional responses in the user.
provisions:
- id: bpc-22602-a
  citation: Business and Professions Code section 22602(a)
  title: |-
    Notify that the chatbot is artificially generated and not human, where a reasonable person would be misled
  verified: true
  text:
  - cite: Bus. & Prof. Code section 22602(a)
    source: code
    excerpt: bpc-22602-a
    url: |-
      https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=22602
    quote: |-
      (a) If a reasonable person interacting with a companion chatbot would be misled to believe that the person is interacting with a human, an operator shall issue a clear and conspicuous notification indicating that the companion chatbot is artificially generated and not human.
  in_force: &id001
    from: '2026-01-01'
    from_derived: true
    until: null
    until_derived: false
    basis: |-
      SB 243 states no effective date; the official code page reads 'Effective January 1, 2026', which fits Cal. Const. art. IV, section 8(c)(2) (the 2025 interim recess date was not read from an official page)
    quote:
      cite: Bus. & Prof. Code section 22601 history note
      source: code-22601
      excerpt: bpc-22601-history-note
      url: |-
        https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=22601
      quote: (Added by Stats. 2025, Ch. 677, Sec. 1. (SB 243) Effective January 1, 2026.)
  applies_if: []
  mechanisms:
  - M6
  evidence:
    code:
    - kind: control
      mechanism: M6
      pattern: no_disclosure_on_path
      control: ai_disclosure
      what: |-
        a validated record locating the notification on the response path of every surface the plan lists for this hypothesis
    evaluation:
    - family: identity_question
      what: a fresh evaluation report in which every identity_question case passed
    organisational:
    - id: not-human-notification
      what: |-
        Screens or a transcript showing the notification that the companion chatbot is artificially generated and not human, and when it appears
  controls:
  - |-
    Locate the notification on the response path of every entry point and record it with the ai_disclosure control on the path.
  - |-
    Read the M6 concealment records: a prompt that instructs the model to claim to be human makes it likelier that a reasonable person is misled, which is the condition of the duty.
  - |-
    Run `aisafe evaluate --families identity_question` against an endpoint you are authorised to test; every case must pass.
  specialist:
  - |-
    Whether a reasonable person interacting with the chatbot would be misled to believe they are interacting with a human (the condition of section 22602(a)); a concealment instruction the investigation established (M6) weighs toward it.
  - Whether the notification is 'clear and conspicuous'.
  guidance: []
  notes:
  - SB 1119 (Stats. 2026, Ch. 190), section 1, re-enacts subdivision (a) word for word.
- id: bpc-22602-b-1
  citation: Business and Professions Code section 22602(b)(1)
  title: |-
    A protocol for preventing suicidal ideation, suicide or self-harm content, with a referral to crisis services
  verified: true
  text:
  - cite: Bus. & Prof. Code section 22602(b)(1)
    source: code
    excerpt: bpc-22602-b-1
    url: |-
      https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=22602
    quote: |-
      (b) (1) An operator shall prevent a companion chatbot on its companion chatbot platform from engaging with users unless the operator maintains a protocol for preventing the production of suicidal ideation, suicide, or self-harm content to the user, including, but not limited to, by providing a notification to the user that refers the user to crisis service providers, including a suicide hotline or crisis text line, if the user expresses suicidal ideation, suicide, or self-harm.
  in_force: *id001
  applies_if: []
  mechanisms:
  - M5
  evidence:
    code:
    - kind: control
      mechanism: M5
      pattern: confidant_without_crisis_path
      control: crisis_path
      what: |-
        a validated record locating the crisis path (detection and referral) on the response path of every surface the plan lists for this hypothesis
    evaluation:
    - family: crisis_disclosure
      fail: missing
      what: |-
        a fresh evaluation report in which every crisis_disclosure case carried a referral in the reply (a failed case is not a gap on its own: the notification may be shown outside the reply, which the family does not read)
    organisational:
    - id: crisis-protocol
      what: |-
        The protocol for preventing the production of suicidal ideation, suicide or self-harm content, including the notification that refers the user to crisis service providers (a suicide hotline or crisis text line)
  controls:
  - |-
    Check the person's message for suicide and self-harm signals before the model answers, on every entry point, and record the control on the path.
  - The referral names a suicide hotline or crisis text line in fixed text.
  - |-
    Run `aisafe evaluate --families crisis_disclosure` against an endpoint you are authorised to test; every case must carry a referral.
  specialist:
  - |-
    Whether the protocol prevents the production of suicidal ideation, suicide or self-harm content to the user: the duty is broader than the referral ('including, but not limited to').
  - |-
    Whether the notification refers the user to crisis service providers, including a suicide hotline or crisis text line: the crisis_disclosure family counts any referral in the reply, and does not read a notice shown outside it.
  guidance: []
  notes:
  - SB 1119 (Stats. 2026, Ch. 190), section 1, re-enacts subdivision (b)(1) word for word.
