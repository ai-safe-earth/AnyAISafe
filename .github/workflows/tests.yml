# .github/workflows/tests.yml
# ---------------------------------------------------------------------------
# The test, audit, lint and build gate.
#
# The suite calls no model and opens no socket, so it runs anywhere. The
# `audit` job exercises the built wheel, not the source tree: the console
# script, the packaged policy, the evaluation corpus and the skill have to
# work from the artifact alone.
# ---------------------------------------------------------------------------

name: Tests

on:
  pull_request:
    branches: [main, develop, "release/**"]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of requires-python = ">=3.10".
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          # Tool installs in this file are pinned to exact versions, so the
          # workflow installs the same thing on every run.
          python -m pip install pip==26.1.2
          # Editable install proves the packaging works, not just the source tree.
          pip install -e ".[dev,devtools]"

      - name: Run tests
        run: pytest -q

      - name: Confirm the suite needs no API keys
        # A test that quietly starts depending on a real provider would pass
        # locally and fail for everyone else. Fail loudly instead.
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: pytest -q

  audit:
    name: aisafe audit gate
    # Runs after the matrix test job. Everything here exercises the built
    # wheel, not the source tree: the console script, the packaged skill and
    # the audit's own package data have to work from the artifact alone.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build the wheel
        run: |
          pip install build==1.2.2.post1
          python -m build --wheel

      - name: Install the wheel into a fresh venv
        # Not an editable install. The venv's bin/ goes first on PATH so that
        # `aisafe` and `python` in the later steps are the installed wheel's.
        run: |
          python -m venv "$RUNNER_TEMP/aisafe-venv"
          "$RUNNER_TEMP/aisafe-venv/bin/pip" install dist/*.whl
          echo "$RUNNER_TEMP/aisafe-venv/bin" >> "$GITHUB_PATH"

      - name: Skill ships in the wheel
        # From a neutral directory so the import cannot fall back to src/.
        run: |
          cd "$RUNNER_TEMP"
          python -c "from aisafe.skills import skill_root; assert (skill_root()/'SKILL.md').exists()"

      - name: Fixture exit codes
        # [tool.aisafe-audit] in pyproject.toml is resolved from the CURRENT
        # DIRECTORY, not from the audited path, and ours sets fail-on = "high"
        # plus an exclude list for the self-audit. These runs therefore cd
        # into a temporary directory (chosen over passing --fail-on low so
        # that the exclude list is not inherited either) and see the plain
        # defaults: fail-on = low, nothing excluded. Exit codes are captured
        # through `|| rc=$?` and compared exactly: a fatal 2 must not pass as
        # "non-zero, as expected".
        run: |
          set -eu
          fixtures="$GITHUB_WORKSPACE/tests/fixtures/audit"
          cd "$(mktemp -d)"

          # persons_companion: a companion prompt with an engagement objective, a
          # hidden AI nature and no crisis path -> findings -> 1.
          rc=0; aisafe audit "$fixtures/persons_companion" --format json -o /dev/null || rc=$?
          test "$rc" -eq 1

          # ts_agent: a TypeScript unit with a model call; the deep analysis exists for
          # Python only, so the unit carries a `deep` UNKNOWN item, and --fail-on-unknown
          # turns it into exit 1 ...
          rc=0; aisafe audit "$fixtures/ts_agent" --fail-on-unknown deep || rc=$?
          test "$rc" -eq 1

          # ... while a tree with no AI surface and no finding exits 0.
          rc=0; aisafe audit "$fixtures/clean_py" || rc=$?
          test "$rc" -eq 0

      - name: Self-audit against the baseline
        # From the repo root on purpose: here [tool.aisafe-audit] supplies the
        # exclude list (tests/, the evaluation corpus and the demo prompts quote
        # the instructions the rules look for) and fail-on = high. Exit 0 means
        # no NEW finding at high or above. Every accepted finding sits in
        # audit-baseline.json with a reason; the terminal summary line
        # `baseline: N new, ...` says how many are not in it.
        #
        # The baseline file is scanned too (it is not excluded), so a reason
        # there must describe the evidence without quoting the text that
        # produced it; tests/unit/test_audit_baseline.py pins that. To accept
        # a finding: `aisafe audit --amend-baseline audit-baseline.json
        # --accept <fingerprint>="<reason>"`, never a bare fingerprint.
        run: |
          rc=0; aisafe audit . --fail-on high --baseline audit-baseline.json || rc=$?
          test "$rc" -eq 0

      - name: Plugin's skill copy matches the packaged skill
        # plugins/aisafe/skills is a byte-identical copy of the packaged skill;
        # exit 1 lists the drifted files.
        run: python scripts/sync_skill.py --check

      - name: Generated rule documents match the registry and the policy
        # docs/rules.md and the skill's references/mechanisms.md are rendered
        # from the rule classes and the policy; exit 1 on drift.
        run: python scripts/rules_md.py --check

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff==0.11.2
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  build:
    name: wheel builds and exposes only `aisafe`
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install build==1.2.2.post1
      - run: python -m build --wheel
      - name: No top-level name collisions
        # The whole point of the src/aisafe layout: a published wheel must not
        # claim `policy`, `rules`, `evidence` or any other common name.
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          top = {n.split("/")[0] for n in zipfile.ZipFile(whl).namelist()}
          pkgs = {t for t in top if not t.endswith(".dist-info")}
          print("top-level in wheel:", sorted(pkgs))
          if pkgs != {"aisafe"}:
              sys.exit(f"wheel exposes more than `aisafe`: {sorted(pkgs)}")
          PY

      - name: Policy and evaluation corpus are readable from the wheel
        # From /tmp so the imports cannot fall back to src/: the YAML files are
        # package data and have to travel inside the artifact.
        run: |
          pip install dist/*.whl
          cd /tmp
          python -c "
          from aisafe.policy import load_policy, charter_path
          from aisafe.evaluation.scenarios import load_corpus
          policy = load_policy()
          assert policy.version and len(policy.mechanisms) == 8, policy
          assert charter_path().is_file(), charter_path()
          cases = load_corpus(None, None, include_scenario=True)
          assert cases, 'no evaluation cases in the wheel'
          print(f'policy {policy.version}, {len(policy.mechanisms)} mechanisms, {len(cases)} evaluation cases')
          "

  action:
    name: composite action (dogfood)
    # `action.yml` is what other repositories run with one `uses:` line. Run it on
    # this checkout, installed from the action path rather than PyPI, against our own
    # baseline: the step's exit code is the audit's, so a new high finding fails here
    # the same way it would fail a consumer. SARIF upload is off because the job
    # has no security-events permission; the `audit` job above covers the gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: dogfood
        with:
          install-from: action-path
          baseline: audit-baseline.json
          fail-on: high
          upload-sarif: "false"
          pr-comment: "false"
      - name: Outputs are set
        env:
          EXIT_CODE: ${{ steps.dogfood.outputs.exit-code }}
          FINDINGS: ${{ steps.dogfood.outputs.findings }}
          NEW: ${{ steps.dogfood.outputs.new-findings }}
          REPORT: ${{ steps.dogfood.outputs.report }}
        run: |
          set -eu
          test "$EXIT_CODE" -eq 0
          test -f "$REPORT"
          echo "findings=$FINDINGS new=$NEW report=$REPORT"
