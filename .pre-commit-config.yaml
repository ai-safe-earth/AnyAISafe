# .pre-commit-config.yaml
# -------------------------------------------------------
# This repository's own hooks
# -------------------------------------------------------
# Install:
#   pip install pre-commit
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#
# Run manually on all files:
#   pre-commit run --all-files
#
# Run the audit by hand (it is a pre-push hook; a full run takes seconds here):
#   pre-commit run aisafe-audit --hook-stage pre-push
#
# Skip for one push (use sparingly):
#   git push --no-verify

repos:
  # -------------------------------------------------------
  # The audit against the committed baseline, at push time
  # -------------------------------------------------------
  # Exit 1 means a NEW finding at high or above (or a fingerprint suppressed under an
  # older policy version). Accept a finding with a reason via
  # `aisafe audit --amend-baseline audit-baseline.json --accept <fp>="<reason>"`.
  - repo: local
    hooks:
      - id: aisafe-audit
        name: aisafe audit (prompts and algorithms, against the baseline)
        language: python
        entry: aisafe audit
        args:
          - "."
          - --fail-on
          - high
          - --baseline
          - audit-baseline.json
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # -------------------------------------------------------
  # Companion hooks
  # -------------------------------------------------------

  # Secret detection: a prompt file or a config can carry a key as easily as code.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: Detect hardcoded secrets
        args: ["--baseline", ".secrets.baseline"]

  # Standard Python quality hooks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Vulnerable dependencies
  - repo: https://github.com/pypa/pip-audit
    rev: v2.7.3
    hooks:
      - id: pip-audit
        name: Audit dependencies for known vulnerabilities
