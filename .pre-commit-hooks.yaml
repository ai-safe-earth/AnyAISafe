# .pre-commit-hooks.yaml
# ---------------------------------------------------------------------------
# Hook definition other repositories can point at:
#
#   repos:
#     - repo: https://github.com/ai-safe-earth/AnyAISafe
#       rev: v0.3.0
#       hooks:
#         - id: aisafe-audit
#           args: ["--fail-on", "high", "--baseline", "audit-baseline.json"]
#
# `language: python` makes pre-commit install this repository at `rev` into its own
# environment; the `devtools` extra adds only `tomli` on Python 3.10.
# ---------------------------------------------------------------------------
- id: aisafe-audit
  name: aisafe audit (prompts and algorithms, against a baseline)
  description: Audit the prompts and code of the repository for profiling, manipulation, engineered attachment, deceptive identity and behavioural influence over the person using it; exit 1 on a new finding at or above --fail-on. Findings describe evidence and a policy decision, never a compliance verdict.
  entry: aisafe audit
  args: ["--fail-on", "high"]
  language: python
  additional_dependencies: ["tomli>=2.0; python_version < '3.11'"]
  pass_filenames: false
  always_run: true
  stages: [pre-push]
  minimum_pre_commit_version: "3.2.0"
