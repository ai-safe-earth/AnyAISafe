[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
# Single entry point. `aisafe <command> --help` shows each command's own options.
#   aisafe audit . --format json -o audit-report.json
#   aisafe review record --reviewer "J. Doe <product owner>" --purpose "..."
#   aisafe evaluate --transcripts conversations.jsonl
aisafe = "aisafe.cli:main"

[project]
# The project is AnyAISafe; the distribution, the importable name and the console
# script are all `aisafe`.
# pip install "aisafe[devtools]", then `aisafe audit .`
name = "aisafe"
version = "0.2.0"
description = "AnyAISafe: audit the prompts and algorithms of AI-enabled software for profiling, manipulation, engineered emotional attachment, deceptive identity and behavioural influence over the person using it. Deterministic, local, offline; evidence and a policy decision, never a certification."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

keywords = ["AI safety", "AI ethics", "prompt audit", "manipulation", "dark patterns", "AI companions", "emotional attachment", "profiling", "deceptive identity", "behavioural influence", "LLM", "static analysis"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The audit reads files and nothing else: one dependency, for the policy, the review
# records and the evaluation corpus (all YAML). No HTTP client: `aisafe evaluate` uses the
# standard library, and the audit opens no socket at all.
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
# SECURITY.md cites the Security URL: GitHub private vulnerability reporting
# for this repository, so a report never lands in a public issue.
Repository = "https://github.com/ai-safe-earth/AnyAISafe"
Security = "https://github.com/ai-safe-earth/AnyAISafe/security/advisories/new"

[project.optional-dependencies]
# `aisafe audit` reads its [tool.aisafe-audit] defaults out of pyproject.toml; tomli only
# backfills tomllib on Python 3.10. Nothing else is needed: the audit is stdlib + pyyaml.
devtools = [
    "tomli>=2.0; python_version < '3.11'",
]

# Development
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",      # Local hook testing
    "detect-secrets>=1.4",  # Secret scanning companion
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aisafe*"]

[tool.setuptools.package-data]
# The policy ships inside the wheel: `aisafe.policy.load_policy()` reads mechanisms.yaml,
# `charter_path()` points at charter.md. /policy/ at the repository root holds the source
# copies; a test pins the two pairs identical.
"aisafe.policy" = ["*.yaml", "*.md"]
# Scenario corpus for `aisafe evaluate`, loaded via importlib.resources.
"aisafe.evaluation" = ["corpus/*.yaml"]
# Agent skill copied by `aisafe skill install`, read via aisafe.skills.skill_root().
# The recursive glob is the intent; the per-type globs cover setuptools
# versions that do not recurse `**`.
"aisafe.skills" = [
    "ai-safety-audit/**/*",
    "ai-safety-audit/SKILL.md",
    "ai-safety-audit/**/*.md",
    "ai-safety-audit/**/*.yaml",
    "ai-safety-audit/**/*.sh",
    "ai-safety-audit/**/*.ps1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Deliberately-broken audit input; mypy excludes it too.
extend-exclude = ["tests/fixtures", "bench/cases", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]   # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# tests/ stub optional dependencies into sys.modules before importing the code
# under test, so those imports must follow the stub.
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = ["tests/fixtures/"]   # fixtures contain intentionally bad code

# -------------------------------------------------------
# aisafe-audit configuration
# -------------------------------------------------------
# Read by aisafe/audit.py via aisafe/devtools/_config.py. An explicit CLI flag always
# wins over a value here. Per-invocation actions (--write-baseline, --amend-baseline,
# --inventory-only, --list-rules) are never read from this table.
#
# exclude: tests/ and the evaluation corpus quote the very instructions the rules look
# for, as do the demo prompts under examples/ and the bench trees; research/results and
# the bench CSVs are other repositories' findings flattened for labelling, so their
# snippet column would make the self-audit report its own evidence. audit-baseline.json
# is NOT excluded: it is scanned like any other file, so a reason there must describe the
# accepted evidence without quoting the matched text, or the baseline reports itself.
# The repository gate, `aisafe audit . --fail-on high --baseline audit-baseline.json`,
# pins that the committed file stays quiet.
[tool.aisafe-audit]
exclude = [
    "tests",
    "research/results",
    "bench/findings*.csv",
    "bench/cases",
    "examples",
    "src/aisafe/evaluation/corpus",
]
fail-on = "high"
